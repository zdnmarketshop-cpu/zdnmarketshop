<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketShop - Fashion & Aksesoris</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #219150;
        }
    </style>
</head>
<body>

<header>
    <h1>MarketShop</h1>
    <p>Produk Fashion & Aksesoris</p>
</header>

<div class="container">

    <!-- Fashion -->
    <div class="card">
        <img src="https://source.unsplash.com/300x200/?tshirt,fashion" alt="Kaos">
        <h3>Kaos Casual</h3>
        <p class="price">Rp 50.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?jacket,fashion" alt="Jaket">
        <h3>Jaket Stylish</h3>
        <p class="price">Rp 150.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?dress,fashion" alt="Dress">
        <h3>Dress Wanita</h3>
        <p class="price">Rp 130.000</p>
        <button>Beli</button>
    </div>

    <!-- Aksesoris -->
    <div class="card">
        <img src="https://source.unsplash.com/300x200/?watch" alt="Jam Tangan">
        <h3>Jam Tangan</h3>
        <p class="price">Rp 200.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?bag" alt="Tas">
        <h3>Tas Fashion</h3>
        <p class="price">Rp 180.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?sunglasses" alt="Kacamata">
        <h3>Kacamata Stylish</h3>
        <p class="price">Rp 90.000</p>
        <button>Beli</button>
    </div>

</div>

</body>
</html>
