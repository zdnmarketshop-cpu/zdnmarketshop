<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketShop - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #219150;
        }
    </style>
</head>
<body>

<header>
    <h1>MarketShop</h1>
    <p>Produk Home & Living</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?sofa" alt="Sofa">
        <h3>Sofa Minimalis</h3>
        <p class="price">Rp 1.500.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?lamp" alt="Lampu">
        <h3>Lampu Hias</h3>
        <p class="price">Rp 250.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?table" alt="Meja">
        <h3>Meja Kayu</h3>
        <p class="price">Rp 750.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?chair" alt="Kursi">
        <h3>Kursi Modern</h3>
        <p class="price">Rp 300.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?bedroom" alt="Tempat Tidur">
        <h3>Tempat Tidur</h3>
        <p class="price">Rp 2.000.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?home-decor" alt="Dekorasi">
        <h3>Dekorasi Rumah</h3>
        <p class="price">Rp 150.000</p>
        <button>Beli</button>
    </div>

</div>

</body>
</html>
