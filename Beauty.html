<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketShop - Beauty</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #219150;
        }
    </style>
</head>
<body>

<header>
    <h1>MarketShop</h1>
    <p>Produk Beauty</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?lipstick" alt="Lipstik">
        <h3>Lipstik Matte</h3>
        <p class="price">Rp 75.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?makeup" alt="Makeup">
        <h3>Makeup Set</h3>
        <p class="price">Rp 150.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?skincare" alt="Skincare">
        <h3>Skincare Routine</h3>
        <p class="price">Rp 200.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?perfume" alt="Parfum">
        <h3>Parfum Wanita</h3>
        <p class="price">Rp 180.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?facewash" alt="Facewash">
        <h3>Facial Wash</h3>
        <p class="price">Rp 60.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?cosmetics" alt="Kosmetik">
        <h3>Kosmetik Lengkap</h3>
        <p class="price">Rp 220.000</p>
        <button>Beli</button>
    </div>

</div>

</body>
</html>
