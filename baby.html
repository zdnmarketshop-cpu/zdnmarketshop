<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketShop - Baby</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #219150;
        }
    </style>
</head>
<body>

<header>
    <h1>MarketShop</h1>
    <p>Produk Baby</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?baby-clothes" alt="Baju Bayi">
        <h3>Baju Bayi</h3>
        <p class="price">Rp 60.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?baby-toys" alt="Mainan Bayi">
        <h3>Mainan Bayi</h3>
        <p class="price">Rp 80.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?baby-bottle" alt="Botol Susu">
        <h3>Botol Susu</h3>
        <p class="price">Rp 40.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?baby-stroller" alt="Stroller">
        <h3>Stroller Bayi</h3>
        <p class="price">Rp 1.200.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?baby-shoes" alt="Sepatu Bayi">
        <h3>Sepatu Bayi</h3>
        <p class="price">Rp 70.000</p>
        <button>Beli</button>
    </div>

    <div class="card">
        <img src="https://source.unsplash.com/300x200/?baby-bed" alt="Tempat Tidur Bayi">
        <h3>Tempat Tidur Bayi</h3>
        <p class="price">Rp 900.000</p>
        <button>Beli</button>
    </div>

</div>

</body>
</html>
