<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketShop - Sport</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            padding: 10px;
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #219150;
        }
    </style>
</head>
<body>

<header>
    <h1>MarketShop</h1>
    <p>Produk Sport</p>
</header>

<div class="container">

    <!-- Produk 1 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=300" alt="Sepak Bola">
        <h3>Bola Sepak</h3>
        <p class="price">Rp 150.000</p>
        <button>Beli</button>
    </div>

    <!-- Produk 2 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1521412644187-c49fa049e84d?w=300" alt="Sepatu Lari">
        <h3>Sepatu Lari</h3>
        <p class="price">Rp 500.000</p>
        <button>Beli</button>
    </div>

    <!-- Produk 3 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=300" alt="Fitness">
        <h3>Alat Fitness</h3>
        <p class="price">Rp 800.000</p>
        <button>Beli</button>
    </div>

    <!-- Produk 4 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1508609349937-5ec4ae374ebf?w=300" alt="Basket">
        <h3>Bola Basket</h3>
        <p class="price">Rp 200.000</p>
        <button>Beli</button>
    </div>

    <!-- Produk 5 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1505250469679-203ad9ced0cb?w=300" alt="Sepeda">
        <h3>Sepeda</h3>
        <p class="price">Rp 2.000.000</p>
        <button>Beli</button>
    </div>

    <!-- Produk 6 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=300" alt="Raket">
        <h3>Raket Badminton</h3>
        <p class="price">Rp 250.000</p>
        <button>Beli</button>
    </div>

</div>

</body>
</html>
